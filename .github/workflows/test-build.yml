name: Test slide build

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
    paths:
      - slides.qmd
      - _quarto.yml
      - custom.scss
      - assets/**
      - _extensions/**
      - README.md
      - .markdownlint.json
      - .markdownlint-cli2.jsonc
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/test-build.yml
  pull_request:
    paths:
      - slides.qmd
      - _quarto.yml
      - custom.scss
      - assets/**
      - _extensions/**
      - README.md
      - .markdownlint.json
      - .markdownlint-cli2.jsonc
      - package.json
      - pnpm-lock.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      - name: Install D2
        run: |
          curl -fsSL https://d2lang.com/install.sh | sh -s -- --version v0.7.1 --prefix "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build slides
        run: quarto render slides.qmd

      - name: Verify output exists
        run: |
          test -f index.html && echo "Build successful: index.html exists"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Markdown
        run: pnpm run lint
